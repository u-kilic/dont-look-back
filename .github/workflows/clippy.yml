name: Rust CI (minimal)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Potentially required later
      - name: Install system dependencies
        run: 

      # Caching to speed up test build
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "target"

      # Quality Gate 1: Compile test
      - name: Cargo build
        run: cargo build --verbose

      # Quality Gate 2: Clippy
      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      # Quality Gate 3: Unit Tests
      - name: Run tests
        run: cargo test --verbose